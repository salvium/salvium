# Configuration for salviumd
# Syntax: any command line option may be specified as 'clioptionname=value'.
#         Boolean options such as 'no-igd' are specified as 'no-igd=1'.
# See 'salviumd --help' for all available options.

data-dir=/var/lib/salvium
log-file=/var/log/salvium/salvium.log
log-level=0

# Prefer TLS and allow older nodes/miners to connect without it.
# Use enabled to require TLS, or disabled for plaintext only.
p2p-ssl=autodetect
rpc-ssl=autodetect

# Optional stable certificates. P2P accepts public peers without a CA by
# default; configure p2p-ssl-ca-certificates or p2p-ssl-allowed-fingerprints
# to authenticate peers and require TLS.
# p2p-ssl-private-key=/path/to/p2p.key
# p2p-ssl-certificate=/path/to/p2p.crt
# rpc-ssl-private-key=/path/to/rpc.key
# rpc-ssl-certificate=/path/to/rpc.crt

# ZMQ RPC and publications use CURVE by default. The daemon saves its secret
# key to data-dir/zmq-curve.key and its shareable public key to the .pub file.
# ZMQ has no TLS autodetection; use 0 only for clients that require plaintext.
zmq-curve=1
# zmq-curve-secret-key-file=/path/to/zmq-curve.key
